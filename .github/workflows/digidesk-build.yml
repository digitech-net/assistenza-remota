name: DigiDesk Build

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows - exe singolo (x64 + ARM)"
        type: boolean
        default: true
      windows-msi:
        description: "Windows - installer MSI"
        type: boolean
        default: false
      macos:
        description: "macOS - dmg (Intel + Apple Silicon)"
        type: boolean
        default: true
      linux:
        description: "Linux - deb, rpm, pkg (x64 + ARM)"
        type: boolean
        default: true
      sign-windows:
        description: "Firma Windows - prima configura i Secrets: istruzioni nel file SIGNING.md"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: digidesk

jobs:
  clean-release:
    runs-on: ubuntu-latest
    steps:
      - name: Remove previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true

  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.t.outputs.targets }}
    steps:
      - id: t
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          i = json.loads(os.environ["INPUTS"])
          names = ["windows", "macos", "linux"]
          t = {n for n in names if i.get(n) in (True, "true")}
          if i.get("windows-msi") in (True, "true"): t.add("windows")
          print("targets=" + (",".join(sorted(t)) or "none"))
          PY

  run-digidesk-build:
    needs: [clean-release, plan]
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "digidesk"
      targets: ${{ needs.plan.outputs.targets }}
      build-msi: ${{ inputs.windows-msi }}
      sign-windows: ${{ inputs.sign-windows }}
      sign-android: false

  rename-assets:
    needs: run-digidesk-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Rename rustdesk-* assets to digidesk-*
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > names.txt || exit 0
          while read -r name; do
            case "$name" in rustdesk*) ;; *) continue ;; esac
            new="digidesk${name#rustdesk}"
            echo "$name -> $new"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "$name" -D dl
            mv "dl/$name" "dl/$new"
            gh release upload "$TAG" "dl/$new" --repo "$GITHUB_REPOSITORY" --clobber
            gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" -y
            rm -f "dl/$new"
          done < names.txt
