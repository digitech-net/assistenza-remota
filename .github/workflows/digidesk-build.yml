name: DigiDesk Build

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows 64 bit (x64 + ARM)"
        type: boolean
        default: true
      windows-32bit:
        description: "Windows 32 bit (vecchia interfaccia Sciter)"
        type: boolean
        default: false
      macos:
        description: "macOS"
        type: boolean
        default: true
      linux:
        description: "Linux"
        type: boolean
        default: true
      android:
        description: "Android"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: digidesk

jobs:
  clean-release:
    runs-on: ubuntu-latest
    steps:
      - name: Remove previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true

  run-digidesk-build:
    needs: clean-release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "digidesk"
      build-windows: ${{ inputs.windows }}
      build-windows-32bit: ${{ inputs.windows-32bit }}
      build-macos: ${{ inputs.macos }}
      build-linux: ${{ inputs.linux }}
      build-android: ${{ inputs.android }}

  rename-assets:
    needs: run-digidesk-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Rename rustdesk-* assets to digidesk-*
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > names.txt || exit 0
          while read -r name; do
            case "$name" in rustdesk*) ;; *) continue ;; esac
            new="digidesk${name#rustdesk}"
            echo "$name -> $new"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "$name" -D dl
            mv "dl/$name" "dl/$new"
            gh release upload "$TAG" "dl/$new" --repo "$GITHUB_REPOSITORY" --clobber
            gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" -y
            rm -f "dl/$new"
          done < names.txt
